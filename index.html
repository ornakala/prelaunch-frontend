<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ornakala | The Ornexperience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/logo/Ornakala_Icon Color  Logo.png" type="image/png">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <!-- The WebGL Canvas -->
    <canvas id="ornexperience" width="1365" height="945" style="width: 1365px; height: 945px;"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header>
            <img src="assets/logo/Ornakala_Color Logo_Hallmark.png" alt="Ornakala" class="logo">
        </header>

        <main>
            <div class="hero-text">
                <h2 class="pre-title">The Future of Bespoke Luxury</h2>
                <h1 class="main-title">Ornakala</h1>
                <p class="subtitle">Where your imagination becomes a wearable masterpiece.</p>
            </div>

            <div class="launch-info">
                <span class="label">Unveiling On</span>
                <span class="date">06.04.2026</span>
            </div>
        </main>

        <footer>
            <div class="interaction-hint">
                <div class="mouse-icon"></div>
                <span>Immerse in the Ornexperience</span>
            </div>
        </footer>
    </div>

    <!-- Shader Scripts -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float uTime;
        uniform vec2 uMouse;
        uniform vec2 uResolution;
        varying vec2 vUv;

        // Simplex noise function
        vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

        float snoise(vec2 v){
            const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                    -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1;
            i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ;
            m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 st = gl_FragCoord.xy / uResolution.xy;
            st.x *= uResolution.x / uResolution.y;

            // Mouse influence
            vec2 mouse = uMouse / uResolution.xy;
            mouse.x *= uResolution.x / uResolution.y;
            
            float dist = distance(st, mouse);
            float interaction = smoothstep(0.5, 0.0, dist);

            // Flowing noise with multiple layers
            float time = uTime * 0.15;
            float noise1 = snoise(st * 2.5 + time);
            float noise2 = snoise(st * 5.0 - time * 0.7 + interaction * 2.0);
            float noise3 = snoise(st * 8.0 + time * 0.3);
            
            // Create metallic flow patterns
            float metalFlow = snoise(st * 4.0 + vec2(time * 0.5, -time * 0.3));
            
            // Luxury metal colors
            vec3 gold = vec3(0.831, 0.686, 0.216);        // Rich Gold (#D4AF37)
            vec3 roseGold = vec3(0.722, 0.451, 0.451);    // Rose Gold
            vec3 platinum = vec3(0.898, 0.898, 0.906);    // Platinum/Silver
            vec3 deepBlack = vec3(0.02, 0.02, 0.03);      // Deep luxury black
            
            // Create flowing metallic pattern
            float mixFactor1 = smoothstep(-0.3, 0.7, noise1 + noise2 * 0.5);
            float mixFactor2 = smoothstep(0.2, 0.9, metalFlow);
            
            // Blend gold and platinum with rose gold accent
            vec3 metalBlend = mix(gold, platinum, mixFactor1);
            metalBlend = mix(metalBlend, roseGold, noise3 * 0.3);
            
            // Add shimmer effect
            float shimmer = smoothstep(0.6, 0.8, abs(noise3)) * 0.4;
            metalBlend += vec3(shimmer);
            
            // Mix with deep background for depth
            vec3 finalColor = mix(deepBlack, metalBlend, smoothstep(-0.2, 0.8, noise1 + 0.3));
            
            // Add luxury glow on mouse interaction
            vec3 glowColor = mix(gold, platinum, sin(uTime * 2.0) * 0.5 + 0.5);
            finalColor += glowColor * interaction * 0.5;
            
            // Subtle vignette for luxury feel
            float vignette = 1.0 - length(st - 0.5) * 0.8;
            finalColor *= vignette;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script src="script.js"></script>


</body></html>
